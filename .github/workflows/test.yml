name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
      vercel-blob:
        image: ghcr.io/payloadcms/vercel-blob-emulator:latest
        ports:
          - 3100:3000
        env:
          EMULATOR_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Floci
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:4566/ >/dev/null; then
              echo "floci is up"
              exit 0
            fi
            sleep 1
          done
          echo "floci did not start in time" >&2
          exit 1
      - name: Wait for Vercel Blob emulator
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3100/api/blob >/dev/null; then
              echo "vercel-blob emulator is up"
              exit 0
            fi
            sleep 1
          done
          echo "vercel-blob emulator did not start in time" >&2
          exit 1
      - name: Create S3 bucket in Floci
        run: aws --endpoint-url=http://localhost:4566 s3 mb s3://local-storage-bucket
        env:
          AWS_ACCESS_KEY_ID: dev
          AWS_SECRET_ACCESS_KEY: dev
          AWS_DEFAULT_REGION: us-east-1
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          AWS_ACCESS_KEY_ID: dev
          AWS_SECRET_ACCESS_KEY: dev
          AWS_ENDPOINT_URL: http://localhost:4566
